# コンソールや未対応localeのプレイヤーへ適用する既定言語（ja_jp / en_us）
language: ja_jp

mineskin:
  # MineSkin V2 API key. Editing and saving do not require this.
  api-key: ''
  # PUBLIC, UNLISTED, or PRIVATE. PRIVATE may depend on your MineSkin plan.
  visibility: UNLISTED
  # Useful only for debugging generated 64x64 skin PNGs.
  keep-generated-png: false
